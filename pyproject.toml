[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purepdb"
version = "0.2.0"
description = "A minimal, dependency-free pure-Python parser for Microsoft PDB debug-info files"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Daniel Plohmann", email = "daniel.plohmann@fkie.fraunhofer.de" }]
keywords = ["pdb", "codeview", "msf", "debug-info", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    # No "License ::" classifier: PEP 639 deprecates them, and PyPI rejects an
    # upload that carries both a License-Expression and a license classifier.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/danielplohmann/purepdb"
Repository = "https://github.com/danielplohmann/purepdb"
Issues = "https://github.com/danielplohmann/purepdb/issues"

[project.scripts]
purepdb = "purepdb.__main__:cli"

[project.optional-dependencies]
dev = [
    "build",
    "hatchling",  # so `make package` can use --no-isolation
    "pytest>=7",
    "twine",
]

[tool.hatch.build.targets.wheel]
packages = ["purepdb"]

[tool.hatch.build.targets.sdist]
# The groundtruth fixtures are 12 MB of binaries. They belong in the repository
# -- the real-PDB tests are the evidence the parser works -- but shipping them
# to everyone who pip-installs a 40 KB library would be antisocial. Those tests
# skip when the data is absent, so an sdist build stays fully testable minus
# that layer. Clone the repo to run it.
exclude = ["tests/data", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
