# Pinning actions to a commit SHA is what makes them immutable; it also means
# nothing updates them. This is the other half of that decision: a pull request
# when a pinned action moves, so the pin stays current instead of stale.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
